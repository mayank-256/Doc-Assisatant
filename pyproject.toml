[project]
name = "doc-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mayank-256", email = "mayank.yadav@thoughtwin.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chroma>=0.2.0",
    "chromadb>=1.5.9",
    "langchain-core>=1.8.4",
    "langchain-groq>=1.2.1",
    "langchain-text-splitters>=1.2.0",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
doc-assistant = "doc_assistant:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
